name: CodeOptimise CI

on:
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug checkout
        run: |
          echo "=== Git commit ==="
          git rev-parse HEAD

          echo "=== Git branch ==="
          git branch --show-current

          echo "=== AI test file ==="
          sed -n '1,20p' tests/test_ai_insights_service.py

          echo "=== Searching for old imports ==="
          grep -R "backend.fastapi_app" tests || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run pytest
        env:
          PYTHONPATH: .
        run: pytest

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install
      - run: npm run build