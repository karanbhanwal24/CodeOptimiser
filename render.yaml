databases:
  - name: codeoptimise-db
    plan: free
    databaseName: codeoptimise
    user: codeoptimise

services:
  - type: web
    name: codeoptimise-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: codeoptimise-db
          property: connectionString
      - key: AUTO_MIGRATE
        value: "true"
      - key: ALLOWED_ORIGINS
        value: "https://your-frontend-domain.onrender.com"
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
